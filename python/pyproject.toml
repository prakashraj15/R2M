[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "r2m-platform"
version = "0.1.0"
description = "R2M platform API and OpsPilot mock agent (hackathon prototype)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "asyncpg==0.32.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "psutil==7.2.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["r2m_platform*", "mock_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
