# Two apps, two images, two containers:
#   r2m       R2M Control Plane (platform API + Control Plane UI)   http://localhost:3000
#   opspilot  OpsPilot vendor agent (agent API + Operations Desk)   http://localhost:3001
# OpsPilot reaches R2M only over the network (http://r2m:3000/api) with its per-customer SDK token.
services:
  r2m:
    build:
      context: .
      dockerfile: Dockerfile
    image: r2m-control-plane:${R2M_VERSION:-1.0.0}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      # Overrides .env so the same file works for local scripts (./secrets/...) and the container.
      DATABASE_CA_CERT: /run/certs/aiven-ca.pem
      R2M_INTERNAL_API_URL: http://127.0.0.1:8000
    volumes:
      # Aiven project CA (public certificate, not a secret). Download from the Aiven console.
      - ./secrets/aiven-ca.pem:/run/certs/aiven-ca.pem:ro
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  opspilot:
    build:
      context: .
      dockerfile: Dockerfile.opspilot
    image: opspilot:${R2M_VERSION:-1.0.0}
    ports:
      - "127.0.0.1:3001:3001"
    # Least privilege: only what the agent needs (no database, session or Keewano secrets).
    environment:
      R2M_API_URL: http://r2m:3000
      R2M_CONTROL_PLANE_URL: http://localhost:3000
      OPSPILOT_SDK_TOKEN: ${OPSPILOT_SDK_TOKEN:?issue one with scripts/sdk_token.py and put it in .env}
      OPSPILOT_SESSION_KEY: ${OPSPILOT_SESSION_KEY:?set a random 32+ character key in .env (signs desk sign-in cookies)}
      R2M_VENDOR_ORG_ID: b5333f96-384a-5bf6-9841-589df8574da5     # Atlas Applied AI (seed id)
      R2M_CUSTOMER_ORG_ID: 45a47bd0-ae2c-55b1-9bce-6a70902564e3   # Meridian Financial (seed id)
      R2M_ENVIRONMENT: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPSPILOT_LLM_MODE: ${OPSPILOT_LLM_MODE:-}
      HEALTH_URLS: http://127.0.0.1:8100/agent-api/health,http://127.0.0.1:3001/
    depends_on:
      r2m:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
